name: Gitea Production CI/CD

on:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=client --validate=false -f k8s/namespace.yml
          kubectl apply --dry-run=client --validate=false -f k8s/postgres.yml
          kubectl apply --dry-run=client --validate=false -f k8s/gitea.yml
          kubectl apply --dry-run=client --validate=false -f monitoring/prometheus-config.yml
          kubectl apply --dry-run=client --validate=false -f monitoring/prometheus.yml

      - name: Lint check
        run: |
          echo "All manifests validated successfully"
          echo "Deploy with: kubectl apply -f k8s/ && kubectl apply -f monitoring/"
