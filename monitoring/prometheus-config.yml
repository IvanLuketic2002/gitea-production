apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: gitea
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'gitea'
        static_configs:
          - targets: ['gitea:3000']
        metrics_path: '/metrics'

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - gitea
